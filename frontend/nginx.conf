# Nginx local do frontend (SPA): qualquer rota desconhecida cai no index.html,
# permitindo React Router em /colaborador e demais telas. Só para conferência
# local — produção usa o bloco Nginx de docs/DEPLOY-VPS.md.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
