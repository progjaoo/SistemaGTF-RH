# Aglomerado local de conferência — Sistema RH Grupo GTF
#
# Sobe banco + API + frontend juntos no Docker, isolado do ambiente de dev
# (portas 5433/3333/5173 para não conflitar com `docker-compose.yml` de dev).
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec -T api npm run seed
#
# URLs:
#   Frontend: http://localhost:5173/  (portal público em /colaborador)
#   API:      http://localhost:3333/api  (Swagger em /api/docs/)
#
# Derrubar tudo (mantém dados):
#   docker compose -f docker-compose.local.yml down
# Derrubar tudo APAGANDO o banco de teste:
#   docker compose -f docker-compose.local.yml down -v

name: sistema-rh

services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-rh-pg-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_rh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_rh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sistema_rh_test_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: sistema-rh-api-test
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sistema_rh?schema=public
      JWT_SECRET: segredo-local-apenas-para-teste
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3333/api
        VITE_BASE_PATH: /
    container_name: sistema-rh-web-test
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sistema_rh_test_pgdata:
